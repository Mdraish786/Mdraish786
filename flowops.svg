<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
<title id="title">FlowOps — Approval Management Workspace</title><desc id="desc">Animated developer profile artwork. Decorative motion; project links appear below the image.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101D31"/><stop offset="1" stop-color="#080E1C"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#2DD4BF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#12506B" stop-opacity=".4"/><stop offset="1" stop-color="#12506B" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".045"/></pattern>
 <clipPath id="frame"><rect x="1" y="1" width="958" height="238" rx="22"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.runner{stroke-dasharray:95 1900;animation:run 12s linear infinite}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.packet{stroke-dasharray:16 145;animation:packet 3s linear infinite}
@keyframes run{to{stroke-dashoffset:-1995}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes packet{to{stroke-dashoffset:-161}}
.route{animation:route 6s ease-in-out infinite}.node{animation:node 6s ease-in-out infinite}.n1{animation-delay:2s}.n2{animation-delay:4s}@keyframes route{0%{stroke-dashoffset:257}80%,100%{stroke-dashoffset:0}}@keyframes node{0%,32%,100%{opacity:.2}15%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
<rect width="960" height="240" fill="url(#bg)"/><rect width="960" height="240" fill="url(#grid)"/>
<circle cx="830" cy="100" r="270" fill="url(#halo)"/>
<text x="36" y="37" font-size="12" fill="#38BDF8" font-weight="400" letter-spacing="2">01 / APPROVAL MANAGEMENT WORKSPACE</text><text x="34" y="92" font-size="44" fill="#F1F5F9" font-weight="700" letter-spacing="-1">FlowOps</text><text x="36" y="129" font-size="21" fill="#A9B9CF" font-weight="400" >Request. Review. Approve. Track.</text><text x="36" y="165" font-size="15" fill="#859EBB" font-weight="400" >React · TypeScript · FastAPI · PostgreSQL</text><rect x="36" y="189" width="162" height="28" rx="7" fill="#0E2D2C" stroke="#24564F" /><text x="117" y="208" font-size="10" fill="#5EEAD4" font-weight="600" text-anchor="middle" letter-spacing=".7">DEPLOYED ON RENDER</text><text x="216" y="208" font-size="11" fill="#8BA4C0" font-weight="400" letter-spacing="1">ROLE-BASED WORKFLOWS</text><rect x="564" y="43" width="359" height="162" rx="14" fill="#0A1526" stroke="#243D55" /><text x="584" y="69" font-size="10" fill="#6D89A7" font-weight="400" letter-spacing="1.8">APPROVAL ROUTE</text><text x="903" y="69" font-size="10" fill="#38BDF8" font-weight="400" text-anchor="end">01 → 03</text><path d="M615 115H872" fill="none" stroke="#2A455B" stroke-width="2"/><path class="route" d="M615 115H872" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="257"/><circle cx="615" cy="115" r="20" fill="#102339" stroke="#38BDF8" stroke-opacity=".55"/><circle class="node n0" cx="615" cy="115" r="25" fill="none" stroke="#38BDF8" stroke-width="2" opacity=".25"/><text x="615" y="120" font-size="14" fill="#38BDF8" font-weight="700" text-anchor="middle">1</text><text x="615" y="157" font-size="10" fill="#9CB2CD" font-weight="400" text-anchor="middle" letter-spacing="1">REQUEST</text><circle cx="743" cy="115" r="20" fill="#102339" stroke="#A78BFA" stroke-opacity=".55"/><circle class="node n1" cx="743" cy="115" r="25" fill="none" stroke="#A78BFA" stroke-width="2" opacity=".25"/><text x="743" y="120" font-size="14" fill="#A78BFA" font-weight="700" text-anchor="middle">2</text><text x="743" y="157" font-size="10" fill="#9CB2CD" font-weight="400" text-anchor="middle" letter-spacing="1">REVIEW</text><circle cx="871" cy="115" r="20" fill="#102339" stroke="#2DD4BF" stroke-opacity=".55"/><circle class="node n2" cx="871" cy="115" r="25" fill="none" stroke="#2DD4BF" stroke-width="2" opacity=".25"/><text x="871" y="120" font-size="14" fill="#2DD4BF" font-weight="700" text-anchor="middle">3</text><text x="871" y="157" font-size="10" fill="#9CB2CD" font-weight="400" text-anchor="middle" letter-spacing="1">APPROVE</text><text x="584" y="186" font-size="11" fill="#728DA9" font-weight="400" >Every decision, in sequence.</text>
</g>
<rect x="1" y="1" width="958" height="238" rx="22" fill="none" stroke="#26394F"/>
<rect class="runner" x="2" y="2" width="956" height="236" rx="21" fill="none" stroke="url(#accent)" stroke-width="2"/>
</svg>